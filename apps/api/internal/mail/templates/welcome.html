<!DOCTYPE html>
<html lang="es">
<head><meta charset="utf-8"><title>Bienvenido/a a Dental Mirage</title></head>
<body style="margin:0;padding:0;background-color:#f6f2ea;font-family:Arial,Helvetica,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f6f2ea;padding:32px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background-color:#fffdf9;border-radius:18px;padding:40px;">
          <tr>
            <td style="font-size:13px;font-weight:bold;letter-spacing:0.08em;text-transform:uppercase;color:#6e8f72;padding-bottom:16px;">
              Dental Mirage
            </td>
          </tr>
          <tr>
            <td style="font-size:22px;font-weight:bold;color:#35312b;padding-bottom:16px;">
              {{if .Nombre}}¡Bienvenido/a, {{.Nombre}}!{{else}}¡Bienvenido/a!{{end}}
            </td>
          </tr>
          <tr>
            <td style="font-size:15px;line-height:1.6;color:#35312b;padding-bottom:24px;">
              Tu clínica ya está lista en Dental Mirage. Desde el panel podés gestionar tu agenda, tus pacientes y la página pública donde tus pacientes te encuentran y piden turno.
            </td>
          </tr>
          <tr>
            <td style="font-size:13px;line-height:1.5;color:#6b6459;">
              Cualquier duda, respondé este mail.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>

</html>
