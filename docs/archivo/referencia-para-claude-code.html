<!DOCTYPE html>
<!--
  ============================================================================
  REFERENCIA DE COMPORTAMIENTO PARA CLAUDE CODE
  ============================================================================
  Este archivo muestra el comportamiento mobile EXACTO que quiero en el
  apartado de gestión de clínica.

  REGLA DE ORO (lo que hoy está mal en mi app):
  El HEADER y el SIDEBAR deben estar FUERA del contenedor que scrollea.
  Deben ser HERMANOS del área de contenido, no hijos de ella.

  Jerarquía correcta:
    .app  (height:100vh; overflow:hidden  -> la página NO scrollea)
    ├── .nav        HEADER fijo   (hermano del contenido, fuera del scroll)
    └── .cuerpo (fila)
        ├── .sidebar        SIDEBAR fijo (hermano del contenido, fuera del scroll)
        └── .contenido-scroll   <- EL ÚNICO elemento con overflow:auto

  Resultado: al deslizar horizontalmente el calendario/tablas, el header y el
  sidebar quedan inmóviles; solo se mueve el contenido de la sección.

  Adaptá esta estructura a mi framework (React/Vue/etc.) SIN cambiar la versión
  de escritorio. Este HTML es solo la referencia de layout y comportamiento.
  ============================================================================
-->
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Referencia mobile — Dental Mirage</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Courier New', monospace; }
  html, body { background: #f5f2ea; height: 100%; overflow: hidden; } /* la página NO scrollea */

  /* app = columna: header arriba + cuerpo abajo. NO scrollea. */
  .app { display: flex; flex-direction: column; height: 100vh; }

  /* ZONA 1 — HEADER: fijo, FUERA del scroll */
  .nav {
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: space-between;
    padding: clamp(12px,3vw,18px) clamp(14px,4vw,22px);
    background: #faf8f2; border-bottom: 1px solid #e8e3d8; z-index: 10;
  }
  .logo { font-weight: bold; font-size: clamp(14px,4vw,18px); letter-spacing: 1px; color: #2d2d2d; }
  .logo span { color: #3d5443; margin-right: 6px; }
  .menu-btn { font-size: 22px; }

  /* cuerpo = fila: sidebar + contenido. min-height:0 permite que el hijo scrollee. */
  .cuerpo { flex: 1; display: flex; min-height: 0; }

  /* ZONA 2 — SIDEBAR: fijo, FUERA del scroll. No se mueve nunca. */
  .sidebar {
    width: clamp(60px,16vw,190px); flex-shrink: 0;
    padding: clamp(14px,4vw,20px) clamp(6px,2vw,12px);
    display: flex; flex-direction: column; gap: 6px;
    background: #faf8f2; border-right: 1px solid #e8e3d8; z-index: 5;
  }
  .sidebar-item {
    display: flex; align-items: center; gap: 10px;
    padding: clamp(10px,2.6vw,12px) clamp(8px,2vw,13px);
    border-radius: 10px; color: #2d2d2d;
  }
  .sidebar-item .txt { display: none; } /* en celu angosto: solo iconos */
  @media (min-width: 520px) { .sidebar-item .txt { display: inline; font-size: 15px; } }
  .sidebar-item.activo { background: #dfe7df; color: #3d5443; }
  .icon { width: 20px; height: 20px; border: 2px solid currentColor; border-radius: 5px; flex-shrink: 0; }

  /* ZONA 3 — CONTENIDO: EL ÚNICO con overflow. Aquí ocurre TODO el scroll. */
  .contenido-scroll {
    flex: 1; overflow: auto; -webkit-overflow-scrolling: touch;
    padding: clamp(14px,4vw,22px);
  }

  /* El contenido interno usa min-width para desbordar y poder deslizarse.
     Tipografías/espaciados en clamp() -> se ve proporcionado, ni gigante ni chico. */
  .titulo-fila { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: clamp(12px,3vw,16px); min-width: 640px; }
  .titulo { font-size: clamp(22px,6vw,30px); font-weight: bold; color: #2d2d2d; }
  .btn-verde { background: #3d5443; color: #fff; border: none; padding: clamp(9px,2.6vw,12px) clamp(16px,4vw,22px); border-radius: 30px; font-size: clamp(12px,3.2vw,14px); font-weight: bold; white-space: nowrap; }

  .toolbar { display: flex; align-items: center; gap: 10px; background: #faf8f2; border-radius: 14px; padding: clamp(10px,3vw,14px) clamp(12px,3.5vw,16px); margin-bottom: 14px; min-width: 640px; }
  .circle-btn { width: 38px; height: 38px; border-radius: 50%; border: 1px solid #d8d2c4; background: #fff; font-size: 15px; flex-shrink: 0; }
  .pill { border: 1px solid #d8d2c4; background: #fff; border-radius: 30px; padding: 9px 16px; font-size: 14px; white-space: nowrap; }
  .fecha { font-size: 15px; color: #2d2d2d; margin-left: 6px; white-space: nowrap; }
  .vista-toggle { margin-left: auto; display: flex; background: #fff; border-radius: 30px; border: 1px solid #d8d2c4; overflow: hidden; }
  .vista-toggle button { border: none; background: none; padding: 9px 16px; font-size: 14px; white-space: nowrap; }
  .vista-toggle button.activo { background: #3d5443; color: #fff; border-radius: 30px; }

  /* Calendario vista semana: 1 col horas + 7 cols días. min-width -> desborda -> scroll horizontal. */
  .cal { background: #faf8f2; border-radius: 14px; padding: 16px; min-width: 900px; }
  .cal-grid { display: grid; grid-template-columns: 60px repeat(7, 1fr); }
  .cal-head { text-align: center; color: #3d5443; letter-spacing: 1px; font-size: 12px; padding: 10px 4px; border-bottom: 1px solid #e8e3d8; }
  .cal-cell { height: 56px; border-bottom: 1px solid #ede8dd; border-left: 1px solid #ede8dd; }
  .cal-hour { font-size: 12px; color: #888; padding: 6px 4px; text-align: right; }
</style>
</head>
<body>
  <div class="app">

    <!-- ZONA 1: HEADER FIJO (hermano del contenido, NO adentro del scroll) -->
    <div class="nav">
      <div class="logo"><span>▦</span>DENTAL MIRAGE</div>
      <div class="menu-btn">≡</div>
    </div>

    <div class="cuerpo">

      <!-- ZONA 2: SIDEBAR FIJO (hermano del contenido, NO adentro del scroll) -->
      <div class="sidebar">
        <div class="sidebar-item"><span class="icon"></span><span class="txt">General</span></div>
        <div class="sidebar-item activo"><span class="icon"></span><span class="txt">Calendario</span></div>
        <div class="sidebar-item"><span class="icon"></span><span class="txt">Turnos</span></div>
        <div class="sidebar-item"><span class="icon"></span><span class="txt">Pacientes</span></div>
      </div>

      <!-- ZONA 3: CONTENIDO (lo ÚNICO que scrollea) -->
      <div class="contenido-scroll">
        <div class="titulo-fila">
          <div class="titulo">Calendario</div>
          <button class="btn-verde">+ Agregar turno</button>
        </div>

        <div class="toolbar">
          <button class="circle-btn">←</button>
          <button class="pill">Hoy</button>
          <button class="circle-btn">→</button>
          <span class="fecha">24 – 30 de agosto de 2026</span>
          <div class="vista-toggle">
            <button>Día</button>
            <button class="activo">Semana</button>
            <button>Mes</button>
          </div>
        </div>

        <div class="cal">
          <div class="cal-grid">
            <div class="cal-head"></div>
            <div class="cal-head">LUN 24</div>
            <div class="cal-head">MAR 25</div>
            <div class="cal-head">MIÉ 26</div>
            <div class="cal-head">JUE 27</div>
            <div class="cal-head">VIE 28</div>
            <div class="cal-head">SÁB 29</div>
            <div class="cal-head">DOM 30</div>

            <div class="cal-hour">08:00</div><div class="cal-cell"></div><div class="cal-cell"></div><div class="cal-cell"></div><div class="cal-cell"></div><div class="cal-cell"></div><div class="cal-cell"></div><div class="cal-cell"></div>
            <div class="cal-hour">09:00</div><div class="cal-cell"></div><div class="cal-cell"></div><div class="cal-cell"></div><div class="cal-cell"></div><div class="cal-cell"></div><div class="cal-cell"></div><div class="cal-cell"></div>
            <div class="cal-hour">10:00</div><div class="cal-cell"></div><div class="cal-cell"></div><div class="cal-cell"></div><div class="cal-cell"></div><div class="cal-cell"></div><div class="cal-cell"></div><div class="cal-cell"></div>
            <div class="cal-hour">11:00</div><div class="cal-cell"></div><div class="cal-cell"></div><div class="cal-cell"></div><div class="cal-cell"></div><div class="cal-cell"></div><div class="cal-cell"></div><div class="cal-cell"></div>
            <div class="cal-hour">12:00</div><div class="cal-cell"></div><div class="cal-cell"></div><div class="cal-cell"></div><div class="cal-cell"></div><div class="cal-cell"></div><div class="cal-cell"></div><div class="cal-cell"></div>
            <div class="cal-hour">13:00</div><div class="cal-cell"></div><div class="cal-cell"></div><div class="cal-cell"></div><div class="cal-cell"></div><div class="cal-cell"></div><div class="cal-cell"></div><div class="cal-cell"></div>
            <div class="cal-hour">14:00</div><div class="cal-cell"></div><div class="cal-cell"></div><div class="cal-cell"></div><div class="cal-cell"></div><div class="cal-cell"></div><div class="cal-cell"></div><div class="cal-cell"></div>
            <div class="cal-hour">15:00</div><div class="cal-cell"></div><div class="cal-cell"></div><div class="cal-cell"></div><div class="cal-cell"></div><div class="cal-cell"></div><div class="cal-cell"></div><div class="cal-cell"></div>
          </div>
        </div>
      </div>

    </div>
  </div>
</body>
</html>
