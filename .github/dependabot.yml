# Dependabot NO abre PRs: solo avisa (TR-199, addendum). Las alertas siguen
# prendidas, y cada arreglo se hace a mano, con el flujo de siempre.
# - Las de versión están apagadas con `open-pull-requests-limit: 0`: el
#   primer lunes abrieron más de diez PRs, casi todos de versiones mayores,
#   y el equipo prefirió actualizar en rondas de dependencias (TR-197).
# - Las de seguridad están apagadas en la configuración del repo (Settings →
#   Code security → Dependabot security updates), no en este archivo.
# El archivo se queda porque Scorecard lo mira (Dependency-Update-Tool) y
# para poder volver atrás rápido: subí el límite para las de versión, o
# prendé las de seguridad en Settings. El resto sigue armado para eso.
#
# `cooldown` es la misma espera de 7 días que `minimumReleaseAge` de pnpm
# (TR-197): una versión recién publicada puede estar comprometida.
# Menores y parches van juntos en un PR; una mayor va sola, porque es la
# que puede romper algo y se revisa aparte. Sin `labels`: si la etiqueta
# no existe en el repo, Dependabot falla.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Argentina/Cordoba
    cooldown:
      default-days: 7
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(deps)"
    groups:
      menores-y-parches:
        update-types: [minor, patch]

  - package-ecosystem: gomod
    directory: /apps/api
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Argentina/Cordoba
    cooldown:
      default-days: 7
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(deps)"
    groups:
      menores-y-parches:
        update-types: [minor, patch]

  # La raíz cubre .github/workflows/; la action compuesta va aparte, o las
  # actions que usa adentro no se actualizan.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/preparar-pnpm
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Argentina/Cordoba
    cooldown:
      default-days: 7
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(deps)"
    groups:
      menores-y-parches:
        update-types: [minor, patch]

  # Los Dockerfiles de la API y de la web (imágenes base de cada etapa).
  - package-ecosystem: docker
    directories:
      - /apps/api
      - /apps/web
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Argentina/Cordoba
    cooldown:
      default-days: 7
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(deps)"
    groups:
      menores-y-parches:
        update-types: [minor, patch]

  # El Postgres de docker-compose.yml.
  - package-ecosystem: docker-compose
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Argentina/Cordoba
    cooldown:
      default-days: 7
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(deps)"
    groups:
      menores-y-parches:
        update-types: [minor, patch]
