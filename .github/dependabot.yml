# Solo actualizaciones de SEGURIDAD (TR-199, addendum). Las de versión están
# apagadas con `open-pull-requests-limit: 0`: el primer lunes abrieron más
# de diez PRs, casi todos de versiones mayores, y el equipo prefirió hacer
# las actualizaciones en rondas de dependencias a mano (TR-197). Ese límite
# no afecta a las de seguridad, que Dependabot abre apenas sale un aviso con
# arreglo, contra la rama por defecto (`dev`). El archivo se queda porque
# esas PRs toman de acá parte de su configuración (el prefijo del commit,
# por ejemplo) y porque Scorecard lo mira (Dependency-Update-Tool). Para
# volver a prender las de versión, subí el límite: el resto de la
# configuración sigue armada para eso.
#
# `cooldown` es la misma espera de 7 días que `minimumReleaseAge` de pnpm
# (TR-197): una versión recién publicada puede estar comprometida.
# Menores y parches van juntos en un PR; una mayor va sola, porque es la
# que puede romper algo y se revisa aparte. Sin `labels`: si la etiqueta
# no existe en el repo, Dependabot falla.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Argentina/Cordoba
    cooldown:
      default-days: 7
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(deps)"
    groups:
      menores-y-parches:
        update-types: [minor, patch]

  - package-ecosystem: gomod
    directory: /apps/api
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Argentina/Cordoba
    cooldown:
      default-days: 7
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(deps)"
    groups:
      menores-y-parches:
        update-types: [minor, patch]

  # La raíz cubre .github/workflows/; la action compuesta va aparte, o las
  # actions que usa adentro no se actualizan.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/preparar-pnpm
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Argentina/Cordoba
    cooldown:
      default-days: 7
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(deps)"
    groups:
      menores-y-parches:
        update-types: [minor, patch]

  # Los Dockerfiles de la API y de la web (imágenes base de cada etapa).
  - package-ecosystem: docker
    directories:
      - /apps/api
      - /apps/web
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Argentina/Cordoba
    cooldown:
      default-days: 7
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(deps)"
    groups:
      menores-y-parches:
        update-types: [minor, patch]

  # El Postgres de docker-compose.yml.
  - package-ecosystem: docker-compose
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Argentina/Cordoba
    cooldown:
      default-days: 7
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(deps)"
    groups:
      menores-y-parches:
        update-types: [minor, patch]
