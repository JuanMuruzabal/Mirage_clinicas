name: CI

# `dev` corre CI en cada push directo (no solo main) porque es la rama de
# integración — cualquiera que haga `push` directo a `dev` (o mergee un
# feature branch ahí) quiere saber si rompió algo, sin esperar un PR. Y
# porque también dispara deploy (ver el job `deploy` al final) — el
# entorno único de Render (ver TR-021 en docs/Arquitectura y base/tradeoffs.md) se redeploya
# con cada push a `dev`, nunca con `main`.
on:
  push:
    branches: [main, dev]
  pull_request:

# Solo lectura del repo (radiografía técnica 2, Fase B). Sin esto, el
# GITHUB_TOKEN de cada job heredaba el permiso por defecto del repositorio,
# que puede ser de escritura: una action comprometida podría pushear o
# tocar releases. Ningún job lo necesita escrito: el deploy usa sus propios
# secretos (RENDER_DEPLOY_HOOK_*) y upload-artifact, su propio token.
permissions:
  contents: read

# Un PR nuevo cancela la corrida vieja del mismo PR: ya no le importa a
# nadie. Un push nunca se cancela, porque el de `dev` dispara el deploy.
# Va SOLO acá: un workflow llamado con el mismo grupo se bloquearía
# esperándose a sí mismo.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Cada parte vive en su propio workflow reutilizable (ci-*.yml), y este
# archivo es la entrada: los disparadores, la concurrencia y el deploy. Se
# llaman en vez de ser workflows sueltos porque `needs` no cruza
# workflows, y el deploy tiene que esperar a los cuatro jobs de abajo.
# Ninguno recibe secretos.
#
# Las llamadas van con `./` y no con la sintaxis `$/` que pide zizmor
# (self-repository): actionlint 1.7.12 todavía no la reconoce y deja de
# validar la llamada. Un reutilizable con `./` ya se resuelve en el mismo
# commit, y una action local se lee después del checkout, sin otro paso
# antes que pueda cambiarla.
jobs:
  web:
    uses: ./.github/workflows/ci-web.yml # zizmor: ignore[self-repository]

  api:
    uses: ./.github/workflows/ci-api.yml # zizmor: ignore[self-repository]

  test-api:
    uses: ./.github/workflows/ci-tests-api.yml # zizmor: ignore[self-repository]

  test-web:
    uses: ./.github/workflows/ci-tests-web.yml # zizmor: ignore[self-repository]

  # No está en `needs` del deploy a propósito: un runner de GitHub puede
  # medir peor un día sin que el código haya cambiado, y eso no tiene que
  # frenar un arreglo urgente. Falla en el PR, que es donde se decide.
  lighthouse:
    uses: ./.github/workflows/ci-lighthouse.yml # zizmor: ignore[self-repository]

  # Deploy (Sprint 5, T5.5) — repuesto (2026-08-24, blueprint ya aplicado
  # en Render y RENDER_DEPLOY_HOOK_API/WEB ya cargados como secrets del
  # repo, ver TR-022 en docs/Arquitectura y base/tradeoffs.md). Un solo entorno (TR-021):
  # dispara con push a `dev`, no a `main` — `main` sigue corriendo los
  # cuatro jobs de arriba (necesarios acá también), simplemente no
  # dispara deploy todavía. Mismo patrón que Marcuzzi_Madryn en lo demás:
  # CI gatea el deploy, nunca un push directo sin pasar por acá.
  deploy:
    name: Deploy (Render)
    needs: [web, api, test-api, test-web]
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Disparar los Deploy Hooks de Render (api + web)
        # Un secret pegado desde el navegador trae fácil un '\n' de más al
        # final (curl lo rechaza entero: "URL rejected: malformed input")
        # — xargs sin argumentos recorta espacio en blanco de ambos lados
        # de forma portable.
        #
        # Sin -f en el curl: si Render devuelve un error HTTP, queremos
        # VER el código y el cuerpo de la respuesta (no es información
        # sensible, es la respuesta pública de la API de Render) para
        # poder diagnosticarlo, en vez de que curl lo descarte en silencio.
        run: |
          disparar() {
            local nombre="$1" url_raw="$2"
            if [ -z "$url_raw" ]; then
              echo "::error::El secret RENDER_DEPLOY_HOOK_${nombre^^} no está seteado en el repo (Settings → Secrets and variables → Actions)."
              return 1
            fi
            local url
            url=$(printf '%s' "$url_raw" | xargs)
            echo "--- $nombre (longitud original: ${#url_raw}, recortado: ${#url}) ---"
            local status
            status=$(curl -sS -o response.txt -w "%{http_code}" -X POST "$url")
            echo "HTTP status: $status"
            echo "Respuesta:"
            cat response.txt
            if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
              echo "::error::El Deploy Hook de $nombre devolvió status $status"
              return 1
            fi
          }
          fallo=0
          disparar api "$RENDER_DEPLOY_HOOK_API" || fallo=1
          disparar web "$RENDER_DEPLOY_HOOK_WEB" || fallo=1
          exit $fallo
        env:
          RENDER_DEPLOY_HOOK_API: ${{ secrets.RENDER_DEPLOY_HOOK_API }}
          RENDER_DEPLOY_HOOK_WEB: ${{ secrets.RENDER_DEPLOY_HOOK_WEB }}
