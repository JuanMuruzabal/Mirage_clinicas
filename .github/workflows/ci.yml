name: CI

# `dev` corre CI en cada push directo (no solo main) porque es la rama de
# integración — cualquiera que haga `push` directo a `dev` (o mergee un
# feature branch ahí) quiere saber si rompió algo, sin esperar un PR. Y
# porque también dispara deploy (ver el job `deploy` al final) — el
# entorno único de Render (ver TR-021 en docs/tradeoffs.md) se redeploya
# con cada push a `dev`, nunca con `main`.
on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  web:
    name: web (lint + typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint:web

      - name: Typecheck (web)
        run: pnpm run typecheck:web

      - name: Typecheck (shared-types)
        run: pnpm run typecheck:shared-types

      - name: Build
        run: pnpm run build:web

  api:
    name: api (vet + lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          working-directory: apps/api
          version: latest

      - name: Build
        run: go build ./...

  # T0.4 (docs/implementation-plan.md): gate de coverage 80% activo desde
  # Sprint 0 — ver TR-007 en docs/tradeoffs.md (lección aplicada de
  # Marcuzzi_Madryn, donde este gate se agregó recién al final del
  # proyecto). Dos jobs paralelos, uno por stack.
  test-api:
    name: "Run tests and quality gates (api)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      # Nunca la base de desarrollo — internal/testdb rechaza cualquier
      # TEST_DATABASE_URL que no termine en "_test" (ver spec §9.6).
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dental_mirage
          POSTGRES_PASSWORD: dental_mirage
          POSTGRES_DB: dental_mirage_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dental_mirage -d dental_mirage_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://dental_mirage:dental_mirage@localhost:5432/dental_mirage_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod

      # ./internal/... en vez de ./... — cmd/api y cmd/migrate son binarios
      # main sin archivos de test, y pedirles -coverprofile hace fallar
      # `go test ./...` con "no such tool covdata" en algunos toolchains.
      - name: Test with coverage
        run: go test ./internal/... -race -coverprofile=coverage.out -covermode=atomic

      - name: Check coverage >= 80%
        run: |
          go tool cover -func=coverage.out | tail -1
          total=$(go tool cover -func=coverage.out | tail -1 | grep -oE '[0-9]+\.[0-9]+')
          echo "Coverage total: ${total}%"
          awk -v c="$total" 'BEGIN { exit !(c >= 80) }'

  test-web:
    name: "Run tests and quality gates (web)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # coverage.thresholds en apps/web/vitest.config.mts ya hace fallar
      # este comando si algún indicador baja de 80% — no hace falta un
      # chequeo aparte como en el job de api.
      - name: Test with coverage
        run: pnpm --filter @dental-mirage/web test:coverage

  # Deploy (Sprint 5, T5.5) — repuesto (2026-08-24, blueprint ya aplicado
  # en Render y RENDER_DEPLOY_HOOK_API/WEB ya cargados como secrets del
  # repo, ver TR-022 en docs/tradeoffs.md). Un solo entorno (TR-021):
  # dispara con push a `dev`, no a `main` — `main` sigue corriendo los
  # cuatro jobs de arriba (necesarios acá también), simplemente no
  # dispara deploy todavía. Mismo patrón que Marcuzzi_Madryn en lo demás:
  # CI gatea el deploy, nunca un push directo sin pasar por acá.
  deploy:
    name: Deploy (Render)
    needs: [web, api, test-api, test-web]
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Disparar los Deploy Hooks de Render (api + web)
        # Un secret pegado desde el navegador trae fácil un '\n' de más al
        # final (curl lo rechaza entero: "URL rejected: malformed input")
        # — xargs sin argumentos recorta espacio en blanco de ambos lados
        # de forma portable.
        #
        # Sin -f en el curl: si Render devuelve un error HTTP, queremos
        # VER el código y el cuerpo de la respuesta (no es información
        # sensible, es la respuesta pública de la API de Render) para
        # poder diagnosticarlo, en vez de que curl lo descarte en silencio.
        run: |
          disparar() {
            local nombre="$1" url_raw="$2"
            if [ -z "$url_raw" ]; then
              echo "::error::El secret RENDER_DEPLOY_HOOK_${nombre^^} no está seteado en el repo (Settings → Secrets and variables → Actions)."
              return 1
            fi
            local url
            url=$(printf '%s' "$url_raw" | xargs)
            echo "--- $nombre (longitud original: ${#url_raw}, recortado: ${#url}) ---"
            local status
            status=$(curl -sS -o response.txt -w "%{http_code}" -X POST "$url")
            echo "HTTP status: $status"
            echo "Respuesta:"
            cat response.txt
            if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
              echo "::error::El Deploy Hook de $nombre devolvió status $status"
              return 1
            fi
          }
          fallo=0
          disparar api "$RENDER_DEPLOY_HOOK_API" || fallo=1
          disparar web "$RENDER_DEPLOY_HOOK_WEB" || fallo=1
          exit $fallo
        env:
          RENDER_DEPLOY_HOOK_API: ${{ secrets.RENDER_DEPLOY_HOOK_API }}
          RENDER_DEPLOY_HOOK_WEB: ${{ secrets.RENDER_DEPLOY_HOOK_WEB }}
