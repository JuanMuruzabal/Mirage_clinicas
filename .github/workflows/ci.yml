name: CI

# `dev` corre CI en cada push directo (no solo main) porque es la rama de
# integración — cualquiera que haga `push` directo a `dev` (o mergee un
# feature branch ahí) quiere saber si rompió algo, sin esperar un PR. El
# job `deploy` que disparaba los Deploy Hooks de Render en cada push a
# `dev` está sacado por ahora (ver el comentario grande al final del
# archivo) hasta terminar de configurar Render — nada de esto cambia
# mientras tanto.
on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  web:
    name: web (lint + typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint:web

      - name: Typecheck (web)
        run: pnpm run typecheck:web

      - name: Typecheck (shared-types)
        run: pnpm run typecheck:shared-types

      - name: Build
        run: pnpm run build:web

  api:
    name: api (vet + lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          working-directory: apps/api
          version: latest

      - name: Build
        run: go build ./...

  # T0.4 (docs/implementation-plan.md): gate de coverage 80% activo desde
  # Sprint 0 — ver TR-007 en docs/tradeoffs.md (lección aplicada de
  # Marcuzzi_Madryn, donde este gate se agregó recién al final del
  # proyecto). Dos jobs paralelos, uno por stack.
  test-api:
    name: "Run tests and quality gates (api)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      # Nunca la base de desarrollo — internal/testdb rechaza cualquier
      # TEST_DATABASE_URL que no termine en "_test" (ver spec §9.6).
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dental_mirage
          POSTGRES_PASSWORD: dental_mirage
          POSTGRES_DB: dental_mirage_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dental_mirage -d dental_mirage_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://dental_mirage:dental_mirage@localhost:5432/dental_mirage_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod

      # ./internal/... en vez de ./... — cmd/api y cmd/migrate son binarios
      # main sin archivos de test, y pedirles -coverprofile hace fallar
      # `go test ./...` con "no such tool covdata" en algunos toolchains.
      - name: Test with coverage
        run: go test ./internal/... -race -coverprofile=coverage.out -covermode=atomic

      - name: Check coverage >= 80%
        run: |
          go tool cover -func=coverage.out | tail -1
          total=$(go tool cover -func=coverage.out | tail -1 | grep -oE '[0-9]+\.[0-9]+')
          echo "Coverage total: ${total}%"
          awk -v c="$total" 'BEGIN { exit !(c >= 80) }'

  test-web:
    name: "Run tests and quality gates (web)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # coverage.thresholds en apps/web/vitest.config.mts ya hace fallar
      # este comando si algún indicador baja de 80% — no hace falta un
      # chequeo aparte como en el job de api.
      - name: Test with coverage
        run: pnpm --filter @dental-mirage/web test:coverage

  # Deploy (Sprint 5, T5.5) — sacado temporalmente (2026-08-24, pedido
  # explícito del cliente: "quitar la parte del push automatico, porque
  # no pasa el commit a dev sino, y tengo que settear render primero").
  # Con el blueprint todavía sin aplicar en Render, los secrets
  # RENDER_DEPLOY_HOOK_API/WEB no existen — el job fallaba en cada push a
  # `dev` (el script corta con `::error::` si el secret viene vacío),
  # tiñendo de rojo un pipeline que en realidad está bien. Se vuelve a
  # agregar en cuanto el blueprint (render.yaml) esté aplicado en Render y
  # los Deploy Hooks cargados como secrets del repo — ver "Deploy" en
  # README.md y TR-021/TR-022 en docs/tradeoffs.md. El job en sí (curl a
  # los Deploy Hooks, disparado por push a `dev`) queda en el historial de
  # git de este archivo, no hay que reescribirlo de cero.
