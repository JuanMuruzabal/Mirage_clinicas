name: CI lighthouse

# PE-9 (plan Prisma Engine): presupuesto de rendimiento. Con los efectos y
# fondos de PE-4/PE-5 es fácil hacer una página linda y lenta sin que nadie
# lo note, así que se mide la PLANTILLA en cada PR: Lighthouse (emulación
# de celular) sobre tres páginas de demostración, armadas con plantillas
# del catálogo sin API ni base (lib/pagina-publica/demostracion.ts, que
# solo existe con PRISMA_DEMO_PLANTILLAS=1). Umbrales en lighthouserc.json,
# sobre la corrida MEDIANA de tres para que un runner lento no lo tumbe;
# calibrados el 2026-09-23 contra las plantillas actuales (performance
# 0,82–0,86, LCP 3,9–4,2 s simulado). El reporte queda como artefacto.
#
# Lo llama ci.yml, y el deploy NO espera a este job (el porqué está ahí).
on:
  workflow_call:

permissions:
  contents: read

jobs:
  lighthouse:
    name: "Presupuesto de rendimiento (Lighthouse)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preparar pnpm, Node y las dependencias
        uses: ./.github/actions/preparar-pnpm # zizmor: ignore[self-repository]

      - name: Build
        # Un reintento (PP-7): `next build` (Turbopack) falla a veces al
        # procesar las fuentes de Google ("next/font/google queries have
        # exactly one entry"), sin que el código tenga nada — pasó en #61, #62
        # y #67 y siempre anduvo al relanzar. Si falla de verdad, falla dos veces.
        run: pnpm run build:web || { echo "::warning::next build falló; reintentando una vez (fuentes de Google)"; pnpm run build:web; }

      - name: Lighthouse sobre las páginas de demostración
        run: pnpm dlx @lhci/cli@0.15.1 autorun
        env:
          PRISMA_DEMO_PLANTILLAS: "1"

      - name: Guardar el reporte
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lighthouse
          path: .lighthouseci
          if-no-files-found: ignore
