# Blueprint de Render (Infrastructure as Code) — define un único entorno
# como código versionado: base de datos + API (Go, Docker) + web (Next.js,
# Docker). Los VALORES de los secrets nunca viven acá — cada envVar con
# `sync: false` se carga a mano, una sola vez, desde el dashboard de
# Render al aplicar este blueprint (New + → Blueprint → conectar este
# repo). Ver README.md "Deploy" para la guía paso a paso completa.
#
# UN SOLO ENTORNO POR AHORA (corrección 2026-08-24, ver TR-021 en
# docs/tradeoffs.md) — la idea original era prod (rama `main`) + dev (rama
# `dev`) separados con su propia base cada uno, mismo criterio que
# Marcuzzi_Madryn duplicado; el plan free de Render solo permite **una**
# base Postgres por cuenta, así que por ahora queda un solo trío
# db/api/web, con el deploy disparado por push a `dev` (no `main` — ver
# el job `deploy` de .github/workflows/ci.yml). `main` sigue corriendo el
# pipeline de tests/build en cada push, simplemente no dispara ningún
# redeploy todavía. Volver a separar prod/dev es agregar de nuevo el
# segundo trío de abajo (con el sufijo `-dev` que tenía antes) en cuanto
# se pague un plan que permita una segunda base.
#
# Nota sobre storage de fotos (pendiente, Fase 2 — perfil de profesional y
# fotos de la página pública, hoy sin construir): cuando se implemente,
# va a ser Cloudflare R2, mismo patrón dev/prod que Marcuzzi_Madryn (ver
# docs/tradeoffs.md). Los env vars ya están reservados abajo (`sync:
# false`, sin cargar todavía) para no tener que tocar este blueprint de
# nuevo cuando se construya la feature — la convención de key pensada
# para eso (namespaced por profesional, no un bucket plano, porque acá
# hay N profesionales subiendo sus propias fotos, a diferencia de
# Marcuzzi que es una sola aplicación con un dueño):
# `paginas/{profesionalId}/{filename}` y `perfiles/{profesionalId}/{filename}`.

databases:
  - name: dental-mirage-db
    databaseName: dental_mirage
    user: dental_mirage
    # ⚠️ TEMPORAL: plan free mientras no haya clientes reales cargados —
    # mismo criterio y mismo riesgo que Marcuzzi_Madryn (TR-042 de ese
    # proyecto): el plan free de Postgres en Render SE BORRA SOLO a los 30
    # días de creado. Subir a "starter" (o superior) ANTES del primer
    # profesional real registrado — no antes, no hay nada que perder
    # todavía; no después.
    plan: free
    # Postgres 16 — misma versión que docker-compose.yml/CI, así
    # btree_gist y el resto del esquema se comportan igual en los tres
    # entornos (local, este, y el de CI).
    postgresMajorVersion: "16"

services:
  - type: web
    name: dental-mirage-api
    runtime: docker
    dockerfilePath: apps/api/Dockerfile
    dockerContext: apps/api
    plan: free
    healthCheckPath: /health
    # La migración corre en el arranque del propio contenedor (CMD de
    # apps/api/Dockerfile: `/app/migrate && /app/api`), no acá vía
    # `preDeployCommand` — esa es una feature exclusiva de planes pagos de
    # Render, no disponible en el plan `free` de este servicio.
    envVars:
      - key: PORT
        value: "8080" # tiene que matchear EXPOSE 8080 de apps/api/Dockerfile
      # "development", no "production" — hasta que exista un entorno de
      # prod real y separado (ver la nota grande al principio del
      # archivo), este servicio se redeploya con cada push a `dev`.
      - key: APP_ENV
        value: development
      - key: DATABASE_URL
        fromDatabase:
          name: dental-mirage-db
          property: connectionString
      # generateValue: Render genera un secreto aleatorio la primera vez
      # y lo guarda — nadie (ni nosotros acá) llega a verlo en texto plano.
      - key: JWT_SECRET
        generateValue: true
      # URL pública del servicio web de abajo. Si renombrás el servicio o
      # le conectás un dominio propio, hay que actualizar esto a mano
      # (Render no permite interpolar la URL de un servicio dentro de otro
      # en el blueprint).
      # Dominio propio conectado al servicio web de abajo (pedido
      # explícito del cliente, 2026-08-26 — TR-065 en docs/tradeoffs.md):
      # el link de "recuperar contraseña" armaba la URL con
      # miragesoftware.online sin estar seteado, así que aplicaba el
      # default de internal/config, http://localhost:3000 — roto para un
      # usuario real. Se deja TAMBIÉN la URL de onrender.com en CORS por
      # las dudas de que siga siendo alcanzable en paralelo al dominio
      # propio. Si el dominio cambia o se desconecta, actualizar acá a
      # mano (Render no permite interpolar la URL de un servicio dentro
      # de otro en el blueprint).
      #
      # ⚠️ Este valor en el blueprint por sí solo puede no alcanzar: si
      # Render no re-sincroniza automáticamente los env vars de un
      # servicio YA EXISTENTE al cambiar render.yaml, hay que confirmar/
      # pisar el valor a mano en el dashboard (dental-mirage-api →
      # Environment → APP_BASE_URL) y confirmar que el dominio esté
      # conectado de verdad en dental-mirage-web → Settings → Custom
      # Domains — sin eso, este cambio no tiene efecto real.
      - key: CORS_ALLOWED_ORIGINS
        value: https://miragesoftware.online,https://dental-mirage-web.onrender.com
      # Arma los links absolutos de los mails de verificación/reset
      # (docs/feature-sumarte-login-resumen.md) — tiene que ser la URL
      # pública real que visitan los usuarios, no la interna de Render.
      - key: APP_BASE_URL
        value: https://miragesoftware.online
      # Resend (envío real de mails de verificación/reset/bienvenida,
      # spec §6) — sin RESEND_API_KEY, internal/http.AuthDeps.AutoVerifyEmail
      # queda activo (TR-051 en docs/tradeoffs.md): las cuentas nativas
      # nuevas quedan verificadas de entrada, sin mail real. Cargar estos
      # dos valores en el dashboard de Render revierte ese modo solo, sin
      # otro cambio — RESEND_FROM_EMAIL tiene que ser una dirección de un
      # dominio verificado en la cuenta de Resend, no cualquier mail.
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      # Google OAuth (login social, spec §2) — sin estos dos, POST
      # /auth/google responde 501 (nil-safe, ver internal/googleauth) y el
      # botón de Google no se renderiza en el frontend (falta también
      # NEXT_PUBLIC_GOOGLE_CLIENT_ID en dental-mirage-web, más abajo).
      # GOOGLE_REDIRECT_URI casi nunca hace falta tocarlo: "postmessage" es
      # el valor que pide Google para el flujo popup (decisión #1 del plan
      # aprobado) — se deja explícito para no depender del default.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: postmessage
      # Cloudflare Turnstile (CAPTCHA en registro y reset de password,
      # spec §7) — sin esto, deshabilitado (nil-safe). Falta también
      # NEXT_PUBLIC_TURNSTILE_SITE_KEY en dental-mirage-web, más abajo.
      - key: TURNSTILE_SECRET_KEY
        sync: false
      # HaveIBeenPwned (spec §7) — apagado por default para no depender de
      # red saliente en cada registro; "true" lo activa.
      - key: HIBP_ENABLED
        value: "false"
      # R2 — storage de fotos, ver la nota grande al principio del
      # archivo. Reservado, sin cargar hasta que la feature exista.
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_URL
        sync: false

  - type: web
    name: dental-mirage-web
    runtime: docker
    dockerfilePath: apps/web/Dockerfile
    # Contexto en la raíz del repo (no apps/web) — el build depende de
    # packages/shared-types vía "workspace:*", ver el comentario al
    # principio de apps/web/Dockerfile.
    dockerContext: .
    plan: free
    envVars:
      - key: PORT
        value: "3000" # ya viene seteado en el Dockerfile (ENV PORT=3000), explícito acá igual
      # URL pública del servicio de arriba — Next.js (Server Actions/
      # Components) le habla a la API server-to-server con esto, nunca
      # desde el navegador. Mismo comentario que CORS_ALLOWED_ORIGINS
      # sobre actualizarlo a mano si cambia el nombre del servicio.
      - key: API_URL
        value: https://dental-mirage-api.onrender.com
      # No es un secret de seguridad — sync: false simplemente porque acá
      # no sabemos el email de contacto real del cliente, hay que cargar
      # el dato de verdad una vez (reemplaza el placeholder de desarrollo).
      - key: CONTACTO_EMAIL
        sync: false
      # Client ID de Google OAuth — NO es un secreto, viaja al navegador
      # para armar el botón de Google (el client secret vive solo en
      # dental-mirage-api, arriba). Sin esto, el botón de Google
      # directamente no se renderiza (nil-safe).
      - key: NEXT_PUBLIC_GOOGLE_CLIENT_ID
        sync: false
      # Site key pública de Cloudflare Turnstile — sin esto, el widget de
      # CAPTCHA no se renderiza (mismo criterio nil-disabled).
      - key: NEXT_PUBLIC_TURNSTILE_SITE_KEY
        sync: false
